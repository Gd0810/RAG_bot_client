{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="{{ profile.theme_color|default:'teal' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ profile.name|default:"Organization" }} | AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'orgbot/css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    <script src="{% static 'orgbot/js/chat.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
